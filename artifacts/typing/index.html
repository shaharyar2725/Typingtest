<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#09C4D9" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Default fallback meta (overridden per-page by useSEO). -->
    <title>TakeTypingTest — Free Typing Practice & Online Typing Test</title>
    <meta name="description" content="Free online typing practice and typing test. Pick your time, words or quotes, watch your live WPM and accuracy. No signup required." />
    <meta name="keywords" content="typing practice, typing test, free typing test, wpm test, words per minute, online typing practice, typing speed test, take typing test" />
    <link rel="canonical" href="https://taketypingtest.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (defaults; per-page hook overrides) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TakeTypingTest" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="TakeTypingTest — Free Typing Practice & Online Typing Test" />
    <meta property="og:description" content="Free online typing practice and typing test. Live WPM, accuracy. No signup required." />
    <meta property="og:image" content="https://taketypingtest.com/og-image.png" />
    <meta property="og:url" content="https://taketypingtest.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TakeTypingTest — Free Typing Practice & Online Typing Test" />
    <meta name="twitter:description" content="Free online typing practice and typing test. Live WPM, accuracy." />
    <meta name="twitter:image" content="https://taketypingtest.com/og-image.png" />

    <!-- Fonts: preconnect + async load to eliminate render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"></noscript>

    <!-- Site-wide entity graph: WebSite + Organization. Per-page schemas are
         injected by the useSEO hook with the data-seo-jsonld attribute. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://taketypingtest.com/#website",
          "url": "https://taketypingtest.com/",
          "name": "TakeTypingTest",
          "description": "Free typing practice, typing tests and an interactive touch-typing course.",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://taketypingtest.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://taketypingtest.com/#organization",
          "name": "TakeTypingTest",
          "url": "https://taketypingtest.com/",
          "logo": "https://taketypingtest.com/og-image.png"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
